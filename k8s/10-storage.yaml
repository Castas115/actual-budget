apiVersion: v1
kind: PersistentVolume
metadata:
  name: actual-data
spec:
  capacity:
    storage: 5Gi
  accessModes: ["ReadWriteOnce"]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  claimRef:
    namespace: actual
    name: actual-data
  hostPath:
    path: /opt/actual/data
    type: DirectoryOrCreate
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values: ["pc2"]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: actual-data
  namespace: actual
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: ""
  volumeName: actual-data
  resources:
    requests:
      storage: 5Gi
